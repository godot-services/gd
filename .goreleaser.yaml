version: 2

project_name: gd

builds:
  - id: gd
    main: .
    binary: gd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/godot-services/gd/cmd.buildVersion=v{{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "gd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github

# A tag push creates the release; title and notes are edited afterwards (ADR 0020).
# keep-existing keeps edited notes when the job is re-run.
release:
  mode: keep-existing
  replace_existing_artifacts: true
